services:
  postgres:
    image: postgres:17-alpine
    container_name: ers-postgres
    environment:
      POSTGRES_USER: ers
      POSTGRES_PASSWORD: ers_dev_password
      POSTGRES_DB: ers
    ports:
      - "5432:5432"
    volumes:
      - ers_postgres_data:/var/lib/postgresql/data

volumes:
  ers_postgres_data: