services:
  postgres:
    image: postgres:17-alpine
    container_name: ers-postgres
    environment:
      POSTGRES_USER: ers
      POSTGRES_PASSWORD: ers_dev_password
      POSTGRES_DB: ers
    ports:
      - "5432:5432"
    volumes:
      - ers_postgres_data:/var/lib/postgresql/data


  admin:
    build:
      context: .
      dockerfile: src/ERS.Admin/Dockerfile
    container_name: ers-admin
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: ers-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin
    restart: unless-stopped

volumes:
  ers_postgres_data:
  caddy_data:
  caddy_config:
